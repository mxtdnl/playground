/* ---- src/style.css ---- */
/* Turn the Page — styles (SPEC.md section 11, "Paperback Constructivist").
   Light paper theme with ink-night spreads (cover, endings). No dark-mode
   switching. Hard edges: zero border-radius except 50% circles. No gradients.
   Warm shadow on hover only. System fonts only. */

:root {
  /* Colour tokens (SPEC.md 11.1). Contrast rules are in CLAUDE.md. */
  --paper: #F3ECDC;
  --paper-card: #FFFBF2;
  --paper-deep: #E6DCC6;
  --ink: #1C1F33;
  --ink-muted: #565868;
  --rule: #D9CFBA;
  --lever-question: #2747B8;
  --lever-support: #1A7050;
  --lever-observe: #D9A21B;
  --lever-observe-ink: #7A5A08;
  --lever-challenge: #D2401E;
  --lever-challenge-ink: #A8321A;
  --plum: #6B2E7A;
  --white: #FFFFFF;

  /* Type (SPEC.md 11.2). */
  --story: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  --ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

  /* Layout and motion. */
  --gutter: clamp(16px, 4vw, 56px);
  --shadow-warm: 0 8px 18px rgba(122, 72, 24, 0.28);
  --turn: 0.35s;
  --flash: 0.6s;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; border-radius: 0; }
html { background: var(--paper); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
#app { position: relative; }
h1, h2, h3 { font-family: var(--ui); font-weight: 800; line-height: 1.15; margin: 0 0 12px; }
p { margin: 0 0 12px; }
button { font: inherit; color: inherit; cursor: pointer; margin: 0; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Focus is always visible (SPEC.md 15). */
:focus-visible { outline: 3px solid var(--plum); outline-offset: 3px; }
.night :focus-visible { outline-color: var(--lever-observe); }
.page:focus, .page:focus-visible { outline: none; }

/* Shared type roles. */
.eyebrow {
  font: 700 0.75rem/1.3 var(--ui);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin: 0 0 12px;
}
.night .eyebrow { color: var(--paper); }
.eyebrow.with-tag { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.story { font-family: var(--story); font-weight: 400; line-height: 1.6; }
.muted { color: var(--ink-muted); }

/* Storage-unavailable notice (SPEC.md 14.4). Ink on ochre fill. */
.notice {
  background: var(--lever-observe);
  color: var(--ink);
  font: 700 0.85rem/1.4 var(--ui);
  padding: 8px 16px;
  text-align: center;
}

/* ---- Pages ------------------------------------------------------------- */

.page {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 24px var(--gutter) 56px;
  overflow: hidden;
  overflow: clip; /* clips the bleeding geometry without breaking the sticky meters */
}
.page > *:not(.deco) { position: relative; z-index: 1; }
.night { background: var(--ink); color: var(--paper); }
.narrow { max-width: 760px; margin-left: auto; margin-right: auto; }

/* Page turn (SPEC.md 11.3): the old page slides off to the left with a paper
   edge and shadow, over the new one. Instant under reduced motion. */
.turn-out {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  z-index: 40;
  pointer-events: none;
  background: var(--paper);
  border-right: 6px solid var(--paper-card);
  box-shadow: 14px 0 26px rgba(28, 31, 51, 0.32);
  animation: turn-out var(--turn) cubic-bezier(0.55, 0, 0.75, 0.4) forwards;
}
@keyframes turn-out {
  from { transform: translateX(0); }
  to { transform: translateX(-104%); }
}

/* Running head with the page number. */
.runhead {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  max-width: 1240px;
  margin: 0 auto 24px;
  padding-bottom: 8px;
  border-bottom: 3px solid var(--ink);
  font: 700 0.75rem/1.3 var(--ui);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.night .runhead { border-bottom-color: var(--paper); }
.pageno {
  font: italic 400 1.15rem/1 var(--story);
  letter-spacing: 0;
  text-transform: none;
  color: var(--plum);
  white-space: nowrap;
}
.night .pageno { color: var(--lever-observe); }

/* ---- Decorative geometry (SPEC.md 11.4) --------------------------------
   Two or three large shapes per screen at 0.06-0.12 opacity, bleeding off
   the edges, behind content and away from the meters. */
.deco { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.shape { position: absolute; opacity: 0.1; }
.shape.circle { border-radius: 50%; }
.shape.ring { border-radius: 50%; background: transparent !important; border-style: solid; }
.shape.triangle { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.shape.question { background: var(--lever-question); border-color: var(--lever-question); }
.shape.support { background: var(--lever-support); border-color: var(--lever-support); }
.shape.observe { background: var(--lever-observe); border-color: var(--lever-observe); }
.shape.challenge { background: var(--lever-challenge); border-color: var(--lever-challenge); }
.shape.plum { background: var(--plum); border-color: var(--plum); }
.night .shape { opacity: 0.12; }

/* ---- Buttons (SPEC.md 11.4) -------------------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 48px;
  padding: 12px 22px;
  background: var(--plum);
  color: var(--white);
  border: 3px solid var(--plum);
  font: 800 0.85rem/1.2 var(--ui);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-align: center;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-warm); }
.btn--ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.night .btn { border-color: var(--paper); }
.night .btn--ghost { color: var(--paper); }
.btn .dest { font-weight: 700; letter-spacing: 0.04em; text-transform: none; white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.link-back {
  display: inline-flex; align-items: center; min-height: 44px;
  padding: 8px 0; background: none; border: 0;
  font: 700 0.8rem/1.2 var(--ui); letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px;
}

/* ---- Lever code -------------------------------------------------------- */

/* --lc fill/border colour, --lc-on text on a fill, --lc-ink text on paper. */
.lv-question { --lc: var(--lever-question); --lc-on: var(--white); --lc-ink: var(--lever-question); }
.lv-support { --lc: var(--lever-support); --lc-on: var(--white); --lc-ink: var(--lever-support); }
.lv-observe { --lc: var(--lever-observe); --lc-on: var(--ink); --lc-ink: var(--lever-observe-ink); }
.lv-challenge { --lc: var(--lever-challenge); --lc-on: var(--white); --lc-ink: var(--lever-challenge-ink); }

.glyph { display: inline-block; width: 1em; height: 1em; flex: none; color: var(--lc); vertical-align: -0.12em; }
.glyph svg { display: block; width: 100%; height: 100%; }
.lever-tag {
  display: inline-flex; align-items: center; gap: 8px;
  font: 800 0.78rem/1.2 var(--ui); letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--lc-ink);
}
.lever-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 10px;
  background: var(--lc); color: var(--lc-on);
  font: 800 0.78rem/1.2 var(--ui); letter-spacing: 0.14em; text-transform: uppercase;
}
.lever-chip .glyph { color: var(--lc-on); }

/* Lever card: paper card, thick top bar in the lever colour, glyph,
   uppercase name, one-line definition. Selected: solid lever fill. */
.lever-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.lever-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  min-height: 44px;
  padding: 12px 14px 14px;
  background: var(--paper-card);
  color: var(--ink);
  border: 2px solid var(--ink);
  border-top: 10px solid var(--lc);
  text-align: left;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
button.lever-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-warm); }
.lever-card .name {
  display: flex; align-items: center; gap: 8px;
  font: 800 0.9rem/1.2 var(--ui); letter-spacing: 0.14em; text-transform: uppercase;
  padding-right: 1.5rem;
}
.lever-card .def { font-size: 0.86rem; line-height: 1.4; color: var(--ink-muted); }
.lever-card .dest { margin-top: auto; font-size: 0.78rem; font-weight: 700; color: var(--plum); }
.lever-card.is-selected, .lever-card[aria-pressed="true"] { background: var(--lc); color: var(--lc-on); border-color: var(--lc); }
.lever-card.is-selected .def, .lever-card.is-selected .dest,
.lever-card[aria-pressed="true"] .def, .lever-card[aria-pressed="true"] .dest { color: var(--lc-on); }
.lever-card.is-selected .glyph, .lever-card[aria-pressed="true"] .glyph { color: var(--lc-on); }
.key {
  position: absolute; top: 8px; right: 10px;
  font: 700 0.72rem/1 var(--ui); color: var(--ink-muted);
}
.is-selected .key, [aria-pressed="true"] .key { color: inherit; }
.lever-grid.compact .lever-card { padding: 10px 12px; }

/* Line option: paper card with a serif quote and a destination page number.
   In Round 2 it carries no lever colour until revealed. */
.line-list { display: grid; gap: 12px; }
.line-option {
  position: relative;
  display: grid;
  grid-template-columns: 1.5rem minmax(0, 1fr);
  gap: 4px 12px;
  width: 100%;
  min-height: 44px;
  padding: 14px 16px;
  background: var(--paper-card);
  color: var(--ink);
  border: 2px solid var(--ink);
  border-left: 8px solid var(--lc, var(--ink));
  text-align: left;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.line-option:hover { transform: translateY(-2px); box-shadow: var(--shadow-warm); }
.line-option .num { font: 800 0.9rem/1.6 var(--ui); color: var(--ink-muted); }
.line-option .quote { font: 400 1.08rem/1.5 var(--story); }
.line-option .dest { grid-column: 2; justify-self: end; font: 700 0.78rem/1.2 var(--ui); color: var(--plum); }
.line-option.is-selected { background: var(--paper-deep); }

/* ---- Spread: scene, meters, story -------------------------------------- */

.spread {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
  grid-template-areas: "scene story" "meters story";
  gap: 24px 48px;
  align-items: start;
  max-width: 1240px;
  margin: 0 auto;
}
.scene-area { grid-area: scene; }
.meters { grid-area: meters; }
.story-col { grid-area: story; min-width: 0; }

/* Scene (SPEC.md 12): the SVG office and Maya, framed in ink. */
.scene-frame { background: var(--paper-card); border: 3px solid var(--ink); margin: 0; }
.scene-art svg { display: block; width: 100%; height: auto; }

/* Story column. */
.speaker { font: 800 0.75rem/1.2 var(--ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--plum); margin: 0 0 8px; }
.maya-line { font: 400 clamp(1.3rem, 1.05rem + 1vw, 1.75rem)/1.45 var(--story); margin: 0 0 16px; }
.cue {
  font: italic 400 1.04rem/1.6 var(--story);
  color: var(--ink-muted);
  border-left: 4px solid var(--rule);
  padding-left: 14px;
  margin: 0 0 8px;
}
.choices { margin-top: 28px; }
.you-said { font: italic 400 1rem/1.55 var(--story); color: var(--ink-muted); margin: 0 0 16px; }
.reaction { font: 400 clamp(1.2rem, 1rem + 0.8vw, 1.5rem)/1.5 var(--story); margin: 0 0 16px; }
.picked-line {
  font: 400 1.08rem/1.5 var(--story);
  background: var(--paper-card);
  border: 2px solid var(--ink);
  border-left: 8px solid var(--ink);
  padding: 12px 16px;
  margin: 0 0 16px;
}
.reveal {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  margin: 0 0 18px; padding: 12px 14px;
  background: var(--paper-card); border: 2px solid var(--ink);
}
.reveal .verdict { font: 700 0.9rem/1.4 var(--ui); }

/* ---- Meters (SPEC.md 11.4) ---------------------------------------------
   Ten segments, uppercase labels, no numbers. Changed segments flash in the
   causing lever's colour for 0.6s, then settle to ink, with a marker. */
.meters { display: grid; gap: 10px; background: var(--paper); }
.meter {
  display: grid;
  grid-template-columns: 7.5rem minmax(0, 1fr) 1.2rem;
  align-items: center;
  gap: 10px;
}
.meter-label { font: 700 0.75rem/1.2 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; }
.segs { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; height: 16px; }
.seg { background: var(--paper-deep); }
.seg.on { background: var(--ink); }
.seg.flash-on { animation: flash-on var(--flash) ease-out both; }
.seg.flash-off { animation: flash-off var(--flash) ease-out both; }
@keyframes flash-on { 0%, 45% { background: var(--flash-colour); } 100% { background: var(--ink); } }
@keyframes flash-off { 0%, 45% { background: var(--flash-colour); } 100% { background: var(--paper-deep); } }
.mark { font: 700 0.8rem/1 var(--ui); color: var(--ink); text-align: center; }

/* ---- How it works ------------------------------------------------------ */

.how-levers { grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 8px 0 32px; }
.how-meters { max-width: 520px; margin-bottom: 32px; }
.pull {
  font: 400 clamp(1.5rem, 1.2rem + 1.4vw, 2.2rem)/1.3 var(--story);
  border-left: 10px solid var(--plum);
  padding-left: 18px;
  margin: 8px 0 24px;
}
.steps { padding-left: 1.2rem; margin: 0 0 12px; }
.steps li { margin-bottom: 8px; }
.how-title { font-size: clamp(2rem, 1.4rem + 2.4vw, 3.2rem); text-transform: uppercase; letter-spacing: 0.02em; }

/* ---- Cover ------------------------------------------------------------- */

.cover-inner { max-width: 1100px; margin: 0 auto; padding-top: clamp(24px, 8vh, 96px); }
.lockup { display: flex; flex-direction: column; align-items: flex-start; margin: 0 0 32px; }
.lockup span {
  display: block;
  font: 900 clamp(3.2rem, 1.6rem + 7vw, 8rem)/0.9 var(--ui);
  letter-spacing: -0.01em;
  text-transform: uppercase;
  padding: 0.1em 0.2em 0.04em;
}
.lockup .lk1 { background: var(--lever-question); color: var(--white); }
.lockup .lk2 { background: var(--lever-observe); color: var(--ink); margin-left: 1.1em; }
.lockup .lk3 { background: var(--lever-challenge); color: var(--white); margin-left: 0.45em; }
.lockup .lk4 {
  background: var(--lever-support); color: var(--white);
  font-size: clamp(0.85rem, 0.7rem + 0.6vw, 1.15rem); font-weight: 800; letter-spacing: 0.22em;
  padding: 0.6em 1em; margin-left: 2.2em;
}
.premise { font: 400 clamp(1.15rem, 1rem + 0.6vw, 1.45rem)/1.55 var(--story); max-width: 38rem; }

/* ---- Referral note ----------------------------------------------------- */

.referral {
  position: relative;
  max-width: 640px;
  margin: 36px auto 0;
  padding: 44px 36px 32px;
  background: var(--paper-card);
  border: 1px solid var(--rule);
  transform: rotate(-1.2deg);
}
.referral::before {
  content: '';
  position: absolute;
  top: -14px; left: 50%;
  width: 128px; height: 28px;
  background: var(--plum);
  transform: translateX(-50%) rotate(2deg);
}
.referral h1 { font-size: 1.1rem; letter-spacing: 0.16em; text-transform: uppercase; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 18px; }
.field { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 4px 12px; margin-bottom: 10px; }
.field-label { font: 700 0.72rem/1.6 var(--ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-muted); }
.field-value { font: 400 1.02rem/1.55 var(--story); }
.referral .actions { justify-content: flex-end; }

/* ---- Act banner (SPEC.md 11.3) ----------------------------------------- */

.act-1 { --act: var(--lever-question); }
.act-2 { --act: var(--lever-observe); }
.act-3 { --act: var(--lever-challenge); }
.banner {
  display: grid;
  grid-template-columns: clamp(28px, 6vw, 96px) minmax(0, 1fr);
  margin: clamp(24px, 10vh, 120px) calc(-1 * var(--gutter)) 0;
  background: var(--ink);
  color: var(--paper);
}
.banner .slab { background: var(--act); }
.banner .banner-body { padding: clamp(28px, 6vh, 64px) var(--gutter); max-width: 1000px; }
.banner .tag {
  display: inline-block; background: var(--plum); color: var(--white);
  font: 800 0.75rem/1.2 var(--ui); letter-spacing: 0.16em; text-transform: uppercase;
  padding: 6px 12px; margin-bottom: 20px;
}
.cliff { font: 400 clamp(1.6rem, 1.1rem + 2.2vw, 2.8rem)/1.3 var(--story); margin: 0; }
/* Aligned with the banner text: the slab width past the page gutter. */
.banner-actions { margin: 28px 0 0 clamp(28px, 6vw, 96px); }

/* ---- Ending page (SPEC.md 11.3) ---------------------------------------- */

.ending-inner {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
  gap: 48px;
  align-items: center;
  max-width: 1100px;
  margin: clamp(16px, 6vh, 72px) auto 0;
}
.emblem svg { display: block; width: 100%; max-width: 340px; height: auto; margin: 0 auto; }
.ending-title { font-size: clamp(2.2rem, 1.4rem + 3vw, 4rem); text-transform: uppercase; letter-spacing: 0.01em; }
.ending-text { font: 400 clamp(1.15rem, 1rem + 0.6vw, 1.45rem)/1.6 var(--story); }

/* ---- Interlude --------------------------------------------------------- */

.interlude-inner { padding-top: clamp(24px, 10vh, 120px); }
.interlude-title { font: italic 400 clamp(2.6rem, 1.6rem + 4vw, 5rem)/1.05 var(--story); color: var(--plum); margin: 4px 0 24px; }
.interlude-text { font: 400 clamp(1.15rem, 1rem + 0.6vw, 1.45rem)/1.6 var(--story); max-width: 38rem; }

/* ---- Debriefs (SPEC.md 10) --------------------------------------------- */

.debrief { max-width: 1040px; margin: 0 auto; }
.db-title { font-size: clamp(1.8rem, 1.3rem + 2vw, 2.6rem); margin-bottom: 18px; }
.db-section { margin-top: 44px; }
.db-section > h2 {
  font-size: 1.35rem; padding-top: 10px; border-top: 6px solid var(--ink); margin-bottom: 8px;
}
.db-intro { color: var(--ink-muted); max-width: 46rem; }
.ending-card { background: var(--ink); color: var(--paper); padding: 18px 22px; border-left: 12px solid var(--plum); }
.ending-card p.eyebrow { font: 700 0.75rem/1.3 var(--ui); color: var(--paper); margin-bottom: 4px; }
.ending-card h2 { margin-bottom: 6px; font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem); }
.ending-card p { margin: 0; font: 400 1.08rem/1.5 var(--story); }

/* Meter traces: small line charts, ink line, lever-glyph markers. */
.traces { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.trace { margin: 0; background: var(--paper-card); border: 2px solid var(--ink); padding: 10px 10px 4px; }
.trace figcaption { display: flex; justify-content: space-between; gap: 8px; font: 700 0.75rem/1.3 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px; }
.trace .trace-end { color: var(--ink-muted); letter-spacing: 0.06em; }
.trace svg { display: block; width: 100%; height: auto; overflow: visible; }
.tr-bg { fill: var(--paper); }
.tr-turn { fill: var(--plum); opacity: 0.14; }
.tr-ref { stroke: var(--ink-muted); stroke-width: 1; stroke-dasharray: 4 3; }
.tr-ref-label { font: 600 9px/1 var(--ui); fill: var(--ink-muted); stroke: var(--paper); stroke-width: 3px; paint-order: stroke; stroke-linejoin: round; }
.tr-line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: miter; }
.tr-start { fill: var(--ink); }
.tr-break { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 2 3; }
.tr-axis { font: 700 9px/1 var(--ui); fill: var(--ink-muted); letter-spacing: 0.08em; text-transform: uppercase; }
.mk { stroke: var(--ink); stroke-width: 1.5; }
.mk-question { fill: var(--lever-question); }
.mk-support { fill: var(--lever-support); }
.mk-observe { fill: var(--lever-observe); }
.mk-challenge { fill: var(--lever-challenge); }
.mk-hole { fill: var(--paper-card); }
.mk-dot { fill: var(--ink); }
.trace-key { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font: 700 0.78rem/1.3 var(--ui); margin: 6px 0 12px; }
.key-item { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-muted); letter-spacing: 0.08em; text-transform: uppercase; }
.key-swatch { display: inline-block; width: 16px; height: 12px; }
.key-turn { background: var(--plum); opacity: 0.3; }
.key-ref { border-top: 2px dashed var(--ink-muted); height: 0; }

/* Lever counts. */
.counts { list-style: none; padding: 0; margin: 8px 0 12px; display: grid; gap: 8px; }
.count-row { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; background: var(--paper-card); border: 2px solid var(--rule); padding: 8px 12px; }
.count-blocks { display: flex; gap: 4px; flex-wrap: wrap; }
.cb { display: inline-block; width: 18px; height: 18px; background: var(--lc); border: 2px solid var(--lc); }
.cb.cb-clumsy { background: transparent; }
.count-n { font: 700 0.85rem/1.3 var(--ui); }
.count-q { grid-column: 2 / -1; font-size: 0.85rem; color: var(--ink-muted); }
.count-total { max-width: 46rem; }

/* Path replay. */
.path { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 14px; }
.path li { background: var(--paper-card); border: 2px solid var(--ink); border-left: 8px solid var(--lc, var(--ink)); padding: 14px 16px; position: relative; }
.path li.turning { border-width: 4px 4px 4px 8px; border-color: var(--plum) var(--plum) var(--plum) var(--lc); }
.turn-flag { display: inline-block; background: var(--plum); color: var(--white); font: 800 0.72rem/1 var(--ui); letter-spacing: 0.16em; text-transform: uppercase; padding: 6px 10px; margin: -4px 0 10px; }
.path .path-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 8px; font: 700 0.8rem/1.3 var(--ui); }
.path .path-head .pageno { font-size: 1rem; }
.quality { color: var(--ink-muted); }
.quality.q-clumsy { text-decoration: underline; text-decoration-style: dotted; }
.said { font: 400 1.04rem/1.5 var(--story); margin-bottom: 6px; }
.path .reacted { font: italic 400 1rem/1.5 var(--story); color: var(--ink-muted); margin-bottom: 8px; }
.path .note { font-size: 0.92rem; margin: 8px 0 0; padding-top: 8px; border-top: 1px solid var(--rule); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 700 0.72rem/1.2 var(--ui); letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 8px; background: var(--paper-deep); color: var(--ink); }
.chip.up { background: var(--ink); color: var(--paper); }
.chip.down { background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink); }

/* Road not taken. */
.roads { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.road { background: var(--paper-card); border: 2px solid var(--ink); border-top: 8px solid var(--plum); padding: 14px 16px; }
.road-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 700 0.85rem/1.3 var(--ui); }
.road-line { font: italic 400 1rem/1.5 var(--story); color: var(--ink-muted); }
.road ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.road li { display: grid; gap: 2px; font-size: 0.94rem; }

/* Meet Maya. */
.traits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.trait { background: var(--paper-card); border: 2px solid var(--ink); padding: 14px 16px; }
.trait-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.trait-head h3 { margin: 0; font-size: 1.05rem; }
.band { font: 800 0.72rem/1.2 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 8px; background: var(--plum); color: var(--white); }
.trait-changes { color: var(--ink-muted); font-size: 0.9rem; margin: 6px 0 10px; }
.hint { border-left: 4px solid var(--plum); padding-left: 10px; margin-bottom: 10px; }
.hint-label { font: 700 0.7rem/1.3 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 4px; }
.hint-quote { font: italic 400 1rem/1.45 var(--story); margin: 0 0 4px; }
.hint-note { font-size: 0.88rem; margin: 0; }
.moments { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: 0.9rem; }
.moments li { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.moments a.pageno { color: var(--plum); font-weight: 800; }
.moments-none { font-size: 0.9rem; margin: 0; }

/* Lever recognition (Debrief 2). */
.recognition { font: 800 1.2rem/1.3 var(--ui); }
.misses { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.misses li { background: var(--paper-card); border: 2px solid var(--rule); padding: 10px 14px; }
.miss-line { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin: 0; font-size: 0.92rem; }
.miss-line .pageno { margin-right: 6px; }

/* Two sessions side by side (Debrief 2). */
.session-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.session-card { background: var(--ink); color: var(--paper); padding: 16px 18px; }
.session-card .eyebrow { color: var(--paper); margin-bottom: 4px; }
.session-card h3 { font-size: 1.3rem; margin-bottom: 6px; }
.session-summary { font: 400 1rem/1.5 var(--story); }
.glyph-strip { display: flex; gap: 6px; margin: 0; font-size: 1.15rem; }
.glyph-strip .glyph { color: var(--lc); }
.carry { background: var(--paper-card); border-left: 8px solid var(--plum); padding: 12px 16px; margin-bottom: 8px; max-width: 52rem; }
.carry-note { font: 400 1.02rem/1.55 var(--story); margin: 0; }

/* Reflection and Copy summary (Debrief 2). */
.reflection { font: 400 1.08rem/1.6 var(--story); max-width: 46rem; padding-left: 1.4em; }
.reflection li { margin-bottom: 10px; }
.summary-text { display: block; width: 100%; max-width: 46rem; font: 400 0.9rem/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; background: var(--paper-card); color: var(--ink); border: 2px solid var(--ink); padding: 12px; resize: vertical; }
.copy-row { align-items: center; }
.copy-status { font: 700 0.85rem/1.3 var(--ui); color: var(--lever-support); }

/* ---- Narrow layout (SPEC.md 13): single column below 860px, meters in a
   sticky top strip, touch targets of at least 44px. ------------------- */

@media (max-width: 859px) {
  .spread { grid-template-columns: minmax(0, 1fr); grid-template-areas: "meters" "scene" "story"; gap: 16px; }
  .spread .meters {
    position: sticky; top: 0; z-index: 5;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin: 0 calc(-1 * var(--gutter));
    padding: 10px var(--gutter);
    border-bottom: 3px solid var(--ink);
  }
  .meter { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 6px; }
  .meter-label { font-size: 0.66rem; letter-spacing: 0.1em; }
  .meter .segs { grid-column: 1 / -1; grid-row: 2; height: 12px; gap: 2px; }
  .mark { grid-column: 2; grid-row: 1; }
  .how-levers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ending-inner { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .emblem svg { max-width: 200px; }
  .referral { padding: 40px 20px 24px; transform: rotate(-0.6deg); }
  .field { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .choices { margin-top: 20px; }
  .traces, .roads, .traits, .session-cards { grid-template-columns: minmax(0, 1fr); }
  .count-row { grid-template-columns: minmax(0, 1fr) auto; }
  .count-blocks { grid-column: 1 / -1; grid-row: 2; }
  .count-q { grid-column: 1 / -1; }
}
@media (max-width: 420px) {
  .lever-card .def { font-size: 0.8rem; }
  .lever-card .name { font-size: 0.82rem; letter-spacing: 0.1em; }
  .lockup .lk2 { margin-left: 0.6em; }
  .lockup .lk4 { margin-left: 1em; }
  .actions .btn { flex: 1 1 100%; }
}

/* Reduced motion: page turns, meter flashes and hover lifts are flattened. */
@media (prefers-reduced-motion: reduce) {
  .turn-out { display: none; }
  .seg.flash-on, .seg.flash-off { animation: none; }
  .btn, .lever-card, .line-option { transition: none; }
  .btn:hover, button.lever-card:hover, .line-option:hover { transform: none; }
}

<body>
<main id="app"><noscript>Turn the Page needs JavaScript.</noscript></main>
<script>
(function () {
'use strict';
/* ---- src/engine.js ---- */
// Turn the Page — scoring engine.
//
// Pure, deterministic functions with no DOM access. Importable from Node
// (tests, calibrator) and inlined into index.html by build.mjs, which strips
// the `export` keywords. Behaviour is specified in docs/SPEC.md sections 7
// and 9.2; read it before changing anything here.
//
// Every number the engine uses lives in RULES. All values are initial values
// to calibrate (SPEC.md 7.8), and every trait entry is a design hypothesis
// awaiting review by a developmental-coaching expert.

const RULES = {
  // Meters and their range (SPEC.md 6.4).
  meters: ['trust', 'confidence', 'ownership'],
  meterMin: 0,
  meterMax: 100,

  // The four levers, in display order (SPEC.md 4).
  levers: ['question', 'support', 'observe', 'challenge'],

  // Base effect of a skilful use of each lever (SPEC.md 7.2).
  base: {
    question: { trust: 3, confidence: 1, ownership: 6 },
    support: { trust: 7, confidence: 5, ownership: 0 },
    observe: { trust: 2, confidence: 2, ownership: 4 },
    challenge: { trust: -4, confidence: 2, ownership: 9 }
  },

  // Clumsy wording, Round 1 only (SPEC.md 7.2): positive effects are
  // multiplied by positiveFactor, then trustPenalty is added to Trust.
  clumsy: { positiveFactor: 0.4, trustPenalty: -2 },

  // State rules (SPEC.md 7.3). Evaluated against the meters before the choice.
  state: {
    // Challenge with Trust below the threshold: this row replaces the base row.
    challengeBeforeTrust: { lever: 'challenge', trustBelow: 50, row: { trust: -5, confidence: -5, ownership: 2 } },
    // Observe with Trust below the threshold: Trust effect replaced by this value.
    observeBeforeTrust: { lever: 'observe', trustBelow: 40, trust: -2 },
    // Support with Trust at or above the threshold: added to Ownership.
    supportAtHighTrust: { lever: 'support', trustAtLeast: 70, ownership: -2 }
  },

  // Repetition (SPEC.md 7.4). From the streakLength-th consecutive use of the
  // same lever onwards, positive effects are multiplied by positiveFactor and
  // the lever's penalty (if any) is added.
  repetition: {
    streakLength: 3,
    positiveFactor: 0.5,
    penalties: {
      question: { trust: -3 }, // interrogation
      support: { ownership: -3 } // rescuing
    }
  },

  // Trait multipliers (SPEC.md 7.5). Each entry multiplies one meter's effect
  // for one lever when the profile has that trait band.
  //   sign: 'gain' applies only to a positive effect, 'cost' only to a negative one.
  //   act: if set, applies only in that act.
  //   trustBelow: if set, applies only while Trust (before the choice) is below it.
  // Bands not listed (including every `mid` band) are neutral (x 1).
  traitMultipliers: [
    { trait: 'confidence', band: 'low', lever: 'support', meter: 'confidence', sign: 'gain', factor: 1.5, act: 1 },
    { trait: 'confidence', band: 'low', lever: 'challenge', meter: 'trust', sign: 'cost', factor: 1.5 },
    { trait: 'confidence', band: 'high', lever: 'support', meter: 'confidence', sign: 'gain', factor: 0.5 },
    { trait: 'confidence', band: 'high', lever: 'challenge', meter: 'ownership', sign: 'gain', factor: 1.3 },
    { trait: 'extraversion', band: 'low', lever: 'question', meter: 'ownership', sign: 'gain', factor: 0.7, trustBelow: 50 },
    { trait: 'extraversion', band: 'low', lever: 'observe', meter: 'trust', sign: 'gain', factor: 1.3 },
    { trait: 'extraversion', band: 'low', lever: 'observe', meter: 'confidence', sign: 'gain', factor: 1.3 },
    { trait: 'extraversion', band: 'low', lever: 'observe', meter: 'ownership', sign: 'gain', factor: 1.3 },
    { trait: 'extraversion', band: 'high', lever: 'question', meter: 'ownership', sign: 'gain', factor: 1.3 },
    { trait: 'defensiveness', band: 'high', lever: 'challenge', meter: 'trust', sign: 'cost', factor: 1.5 },
    { trait: 'defensiveness', band: 'high', lever: 'observe', meter: 'trust', sign: 'cost', factor: 1.5 }
  ],

  // Caps on the final delta of one decision (SPEC.md 7.5, readiness row).
  traitCaps: [
    { trait: 'readiness', band: 'low', meter: 'ownership', max: 6, act: 1 }
  ],

  // Node overrides (SPEC.md 7.6): authored adjustments must lie in this range.
  overrideMin: -5,
  overrideMax: 5,

  // Endings (SPEC.md 7.7), checked in this order.
  endings: {
    early: { trustAtMost: 10 }, // at any point
    breakthrough: { ownershipAtLeast: 45, trustAtLeast: 45 }, // at the end
    partial: { trustAtLeast: 45, ownershipAtLeast: 30 } // at the end; otherwise 'polite'
  },
  endingOrder: ['early', 'breakthrough', 'partial', 'polite'],

  // Round 2 starting state by Round 1 ending (SPEC.md 9.2).
  //   trustCarry: fraction of Round 1's final Trust carried over.
  //   trust / confidence / ownership: absolute starting values.
  //   confidenceBonus: added to Round 1's final Confidence.
  //   Any meter not given keeps Round 1's final value if carry: true,
  //   otherwise the profile's starting value.
  // Calibrated in session 2 from 0.8 / Ownership 25 (breakthrough), 0.7
  // (partial) and Trust 20 (early): see SPEC.md, Calibration log.
  carry: {
    breakthrough: { trustCarry: 0.7, confidenceBonus: 10, ownership: 20, carry: true },
    partial: { trustCarry: 0.6, ownership: 15, carry: true },
    polite: { trust: 30, carry: false },
    early: { trust: 25, carry: false }
  },
  // Readiness for change rises one band in Round 2 after these endings (SPEC.md 6.2).
  readinessRiseAfter: ['breakthrough', 'partial'],
  bands: ['low', 'mid', 'high']
};

// ---------------------------------------------------------------------------
// Case registry. State objects hold only a caseId (so they can be saved as
// JSON); createRound registers the case so later calls can look it up.

const CASES = {};

function registerCase(caseData) {
  CASES[caseData.id] = caseData;
  return caseData;
}

function getCase(caseId) {
  const c = CASES[caseId];
  if (!c) throw new Error('Unknown case: ' + caseId + ' (call createRound or registerCase first)');
  return c;
}

// ---------------------------------------------------------------------------
// Seeded randomness. Used only for the display order of options.

// 32-bit string hash (FNV-1a).
function hashString(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

// mulberry32: returns a function giving floats in [0, 1).
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Fisher-Yates shuffle of a copy. Seed may be a number or a string.
function shuffle(items, seed) {
  const next = rng(typeof seed === 'number' ? seed : hashString(String(seed)));
  const out = items.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(next() * (i + 1));
    const t = out[i];
    out[i] = out[j];
    out[j] = t;
  }
  return out;
}

// ---------------------------------------------------------------------------
// Helpers.

// Round half away from zero, so a gain and an equal cost round symmetrically
// (Math.round would turn -2.5 into -2 but 2.5 into 3).
function roundHalfAway(x) {
  return (x < 0 ? -Math.round(-x) : Math.round(x)) || 0; // `|| 0` turns -0 into 0
}

function clamp(x) {
  return Math.max(RULES.meterMin, Math.min(RULES.meterMax, x));
}

function zeroRow() {
  return { trust: 0, confidence: 0, ownership: 0 };
}

function getRound(state) {
  return getCase(state.caseId).rounds[state.round];
}

function getNode(state, nodeId) {
  const id = nodeId === undefined ? state.nodeId : nodeId;
  const node = getRound(state).nodes[id];
  if (!node) throw new Error('Unknown node: ' + id);
  return node;
}

// Length of the run of `lever` at the end of history, counting the current choice.
function streakFor(history, lever) {
  let n = 1;
  for (let i = history.length - 1; i >= 0 && history[i].lever === lever; i--) n++;
  return n;
}

// Does a meter condition such as { trust: { min: 50 } } hold?
function conditionHolds(cond, meters) {
  if (!cond) return true;
  return Object.keys(cond).every(function (m) {
    const c = cond[m];
    if (c.min !== undefined && meters[m] < c.min) return false;
    if (c.max !== undefined && meters[m] > c.max) return false;
    return true;
  });
}

// A route is a node id, null (end of round), or a list of
// { to, if: { meter: { min, max } } } entries, the first matching one winning.
function resolveRoute(route, meters) {
  if (route === null || typeof route === 'string') return route;
  if (Array.isArray(route)) {
    for (const r of route) if (conditionHolds(r.if, meters)) return r.to;
    throw new Error('No route matched');
  }
  throw new Error('Bad route: ' + JSON.stringify(route));
}

// The route for an option: the option's own `next` wins; otherwise the node's
// `next`, which is a route or an object keyed by lever with a `default`.
function routeFor(node, option) {
  if (Object.prototype.hasOwnProperty.call(option, 'next')) return option.next;
  const n = node.next;
  if (n && typeof n === 'object' && !Array.isArray(n)) {
    return Object.prototype.hasOwnProperty.call(n, option.lever) ? n[option.lever] : n.default;
  }
  return n;
}

// Pick the reaction line for the profile: the first `trait:band` key that
// matches, otherwise `default`.
function reactionFor(option, traits) {
  const r = option.reaction;
  if (typeof r === 'string') return r;
  for (const key of Object.keys(r)) {
    if (key === 'default') continue;
    const parts = key.split(':');
    if (traits[parts[0]] === parts[1]) return r[key];
  }
  return r.default;
}

// ---------------------------------------------------------------------------
// The formula (SPEC.md 7.1):
//   delta[m] = round( base[lever][quality][m] x traitMultiplier x repetitionFactor
//                     + stateRule + nodeOverride )
// then the trait caps, then the meters clamp to 0-100.
//
// Order of operations (decided in session 1; see README or CLAUDE.md):
//   1. Base row, with state-rule replacements applied (Challenge or Observe
//      before trust) since SPEC.md 7.3 says those replace the base values.
//   2. Clumsy transform (positives x 0.4, then Trust -3).
//   3. Trait multipliers, judged on the sign of the value from step 2.
//   4. Repetition: positives halved from the third consecutive use.
//   5. Additive terms: Support at high trust, repetition penalties, override.
//   6. Round half away from zero; apply trait caps.

function computeDeltas(ctx) {
  const lever = ctx.lever;
  const meters = ctx.meters;
  const traits = ctx.traits;
  const act = ctx.act;
  const S = RULES.state;
  const trace = [];

  // 1. Base row with replacements.
  let row = Object.assign({}, RULES.base[lever]);
  if (lever === S.challengeBeforeTrust.lever && meters.trust < S.challengeBeforeTrust.trustBelow) {
    row = Object.assign({}, S.challengeBeforeTrust.row);
    trace.push('challengeBeforeTrust');
  }
  if (lever === S.observeBeforeTrust.lever && meters.trust < S.observeBeforeTrust.trustBelow) {
    row.trust = S.observeBeforeTrust.trust;
    trace.push('observeBeforeTrust');
  }

  // 2. Clumsy wording.
  if (ctx.quality === 'clumsy') {
    for (const m of RULES.meters) if (row[m] > 0) row[m] *= RULES.clumsy.positiveFactor;
    row.trust += RULES.clumsy.trustPenalty;
    trace.push('clumsy');
  }

  // 3. Trait multipliers.
  for (const tm of RULES.traitMultipliers) {
    if (traits[tm.trait] !== tm.band || tm.lever !== lever) continue;
    if (tm.act !== undefined && tm.act !== act) continue;
    if (tm.trustBelow !== undefined && !(meters.trust < tm.trustBelow)) continue;
    const v = row[tm.meter];
    if ((tm.sign === 'gain' && v > 0) || (tm.sign === 'cost' && v < 0)) {
      row[tm.meter] = v * tm.factor;
      trace.push('trait:' + tm.trait + ':' + tm.band + ':' + tm.meter);
    }
  }

  // 4. Repetition factor.
  const streak = streakFor(ctx.history, lever);
  const repeated = streak >= RULES.repetition.streakLength;
  if (repeated) {
    for (const m of RULES.meters) if (row[m] > 0) row[m] *= RULES.repetition.positiveFactor;
    trace.push('repetition');
  }

  // 5. Additive terms.
  const add = zeroRow();
  if (lever === S.supportAtHighTrust.lever && meters.trust >= S.supportAtHighTrust.trustAtLeast) {
    add.ownership += S.supportAtHighTrust.ownership;
    trace.push('supportAtHighTrust');
  }
  if (repeated && RULES.repetition.penalties[lever]) {
    const p = RULES.repetition.penalties[lever];
    for (const m of Object.keys(p)) add[m] += p[m];
    trace.push('repetitionPenalty');
  }
  const override = ctx.override || {};
  for (const m of Object.keys(override)) {
    add[m] += override[m];
    trace.push('override:' + m);
  }

  // 6. Round and cap.
  const delta = zeroRow();
  for (const m of RULES.meters) delta[m] = roundHalfAway(row[m] + add[m]);
  for (const cap of RULES.traitCaps) {
    if (traits[cap.trait] !== cap.band) continue;
    if (cap.act !== undefined && cap.act !== act) continue;
    if (delta[cap.meter] > cap.max) {
      delta[cap.meter] = cap.max;
      trace.push('cap:' + cap.trait + ':' + cap.meter);
    }
  }
  return { delta: delta, trace: trace };
}

// ---------------------------------------------------------------------------
// Public API.

// Start a round. `carry` is required for Round 2 (from carryOver) and ignored
// for Round 1. `seed` fixes the option display order.
function createRound(caseData, roundId, carry, seed) {
  registerCase(caseData);
  const round = caseData.rounds[roundId];
  if (!round) throw new Error('Unknown round: ' + roundId);
  let meters = Object.assign({}, caseData.profile.start);
  let traits = Object.assign({}, caseData.profile.traits);
  let nodeId = round.start;
  let from = null;
  if (round.starts) {
    if (!carry) throw new Error('Round ' + roundId + ' needs a carry-over (carryOver(r1State))');
    meters = Object.assign({}, carry.meters);
    traits = Object.assign({}, carry.traits);
    nodeId = round.starts[carry.from];
    from = carry.from;
    if (!nodeId) throw new Error('No start for ending ' + carry.from);
  }
  const state = {
    caseId: caseData.id,
    round: roundId,
    nodeId: nodeId,
    meters: meters,
    traits: traits,
    history: [],
    ending: null,
    from: from,
    seed: seed === undefined ? 1 : seed
  };
  state.ending = checkEnding(state);
  return state;
}

// The current node's options in display order (seeded shuffle). Format B
// interfaces group them by lever; format C shows them as they come.
function optionsFor(state) {
  if (state.ending) return [];
  const node = getNode(state);
  const key = state.seed + ':' + state.round + ':' + state.nodeId + ':' + state.history.length;
  return shuffle(node.options, key);
}

// Apply one choice and return a new state (the input is not modified).
// `guess` is the lever the counsellor named in format C; it never affects
// the meters.
function applyChoice(state, optionId, guess) {
  if (state.ending) throw new Error('Round has ended');
  const node = getNode(state);
  const option = node.options.find(function (o) { return o.id === optionId; });
  if (!option) throw new Error('Unknown option ' + optionId + ' at ' + state.nodeId);
  const result = computeDeltas({
    lever: option.lever,
    quality: option.quality || 'skilful',
    meters: state.meters,
    traits: state.traits,
    act: node.act,
    history: state.history,
    override: option.override
  });
  const meters = {};
  const applied = {};
  for (const m of RULES.meters) {
    meters[m] = clamp(state.meters[m] + result.delta[m]);
    applied[m] = meters[m] - state.meters[m];
  }
  const entry = {
    nodeId: state.nodeId,
    optionId: option.id,
    lever: option.lever,
    quality: option.quality || null,
    deltas: applied,
    raw: result.delta,
    trace: result.trace,
    meters: meters,
    reaction: reactionFor(option, state.traits),
    guess: guess === undefined ? null : guess,
    guessCorrect: guess === undefined || guess === null ? null : guess === option.lever
  };
  const next = Object.assign({}, state, {
    meters: meters,
    history: state.history.concat([entry]),
    nodeId: resolveRoute(routeFor(node, option), meters)
  });
  next.ending = checkEnding(next);
  if (next.ending === 'early') next.nodeId = null;
  return next;
}

// The ending, or null while the round continues (SPEC.md 7.7). Early exit
// applies at any point; the others only once the round has run out of nodes.
function checkEnding(state) {
  const E = RULES.endings;
  const m = state.meters;
  if (m.trust <= E.early.trustAtMost) return 'early';
  if (state.nodeId !== null) return null;
  if (m.ownership >= E.breakthrough.ownershipAtLeast && m.trust >= E.breakthrough.trustAtLeast) return 'breakthrough';
  if (m.trust >= E.partial.trustAtLeast && m.ownership >= E.partial.ownershipAtLeast) return 'partial';
  return 'polite';
}

// Round 2 starting state from a finished Round 1 (SPEC.md 9.2).
function carryOver(r1State) {
  if (!r1State.ending) throw new Error('Round 1 has not ended');
  const profile = getCase(r1State.caseId).profile;
  const rule = RULES.carry[r1State.ending];
  const prev = r1State.meters;
  const meters = {};
  for (const m of RULES.meters) meters[m] = rule.carry ? prev[m] : profile.start[m];
  if (rule.trustCarry !== undefined) meters.trust = roundHalfAway(prev.trust * rule.trustCarry);
  if (rule.confidenceBonus !== undefined) meters.confidence = prev.confidence + rule.confidenceBonus;
  for (const m of RULES.meters) {
    if (rule[m] !== undefined) meters[m] = rule[m];
    meters[m] = clamp(meters[m]);
  }
  const traits = Object.assign({}, profile.traits);
  if (RULES.readinessRiseAfter.indexOf(r1State.ending) >= 0) {
    const i = RULES.bands.indexOf(traits.readiness);
    traits.readiness = RULES.bands[Math.min(i + 1, RULES.bands.length - 1)];
  }
  return { from: r1State.ending, meters: meters, traits: traits };
}

// Turn the Page — illustration (SPEC.md section 12).
//
// All art is inline SVG built from code: no image files. The office is made
// of rectangles and circles; Maya is a seated figure of primitives (circle
// head, cut-circle hair, trapezoid torso, jointed bar arms, block legs) in her
// own colours, plum and ochre. Hard edges and flat fills only: no gradients,
// no blur, no rounded rectangles.
//
// Three steps, so the interface can interpolate between poses:
//   poseFor(sceneState)    the six pose parameters (SPEC.md 12) as words
//   sceneVector(sceneState) every coordinate the drawing needs, as numbers
//   drawScene(vec)         the SVG string for one vector
// lerpScene(a, b, t) blends two vectors; ui.js runs it for 0.4s between
// poses (instantly under reduced motion). renderScene(sceneState) does all
// of it at once and also returns the generated alt text.
//
// No scoring numbers live here. The posture bands only choose which picture
// to show; they never change the meters.

// ---------------------------------------------------------------------------
// Posture states (SPEC.md 12), from most closed to most open.

const POSTURES = ['closed', 'guarded', 'neutral', 'open', 'animated'];

// The mean of Trust and Confidence picks a band. Presentation only.
const POSTURE_FLOORS = { closed: 0, guarded: 20, neutral: 40, open: 50, animated: 60 };

// The profile's pose bias pulls the posture towards it: a band on the far
// side of the bias needs this much more (or less) before it shows. With
// Maya's 'guarded' bias, neutral needs a mean of 44 rather than 40, and
// closed needs a mean below 16 rather than 20.
const POSE_BIAS_MARGIN = 4;

function postureFor(meters, poseBias) {
  const score = (meters.trust + meters.confidence) / 2;
  const b = POSTURES.indexOf(poseBias);
  let i = 0;
  POSTURES.forEach(function (p, k) {
    let floor = POSTURE_FLOORS[p];
    if (b >= 0 && k > b) floor += POSE_BIAS_MARGIN; // further above the bias: harder to reach
    if (b >= 0 && k <= b && k > 0) floor -= POSE_BIAS_MARGIN; // at or below it: easier to stay in
    if (score >= floor) i = k;
  });
  return POSTURES[i];
}

// The pose each posture state shows unless a page overrides a parameter.
// Values: shoulders raised|neutral|relaxed; arms crossed|bag|lap|open|gesturing;
// head down|level|up; gaze floor|door|phone|counsellor|window;
// mouth flat|tight|slightSmile|smile; chair edge|back|leaningIn.
const POSTURE_POSES = {
  closed: { shoulders: 'raised', arms: 'crossed', head: 'down', gaze: 'floor', mouth: 'tight', chair: 'back' },
  guarded: { shoulders: 'raised', arms: 'bag', head: 'level', gaze: 'door', mouth: 'flat', chair: 'edge' },
  neutral: { shoulders: 'neutral', arms: 'lap', head: 'level', gaze: 'counsellor', mouth: 'flat', chair: 'back' },
  open: { shoulders: 'relaxed', arms: 'open', head: 'level', gaze: 'counsellor', mouth: 'slightSmile', chair: 'back' },
  animated: { shoulders: 'relaxed', arms: 'gesturing', head: 'up', gaze: 'counsellor', mouth: 'smile', chair: 'leaningIn' }
};

const POSE_PARAMS = {
  shoulders: ['raised', 'neutral', 'relaxed'],
  arms: ['crossed', 'bag', 'lap', 'open', 'gesturing'],
  head: ['down', 'level', 'up'],
  gaze: ['floor', 'door', 'phone', 'counsellor', 'window'],
  mouth: ['flat', 'tight', 'slightSmile', 'smile'],
  chair: ['edge', 'back', 'leaningIn']
};

// sceneState: { meters, poseBias, pose (page overrides), props, round, step }
// Returns the posture and the full set of parameters after overrides.
function poseFor(sceneState) {
  const posture = postureFor(sceneState.meters, sceneState.poseBias);
  const pose = Object.assign({}, POSTURE_POSES[posture]);
  const over = sceneState.pose || {};
  Object.keys(POSE_PARAMS).forEach(function (k) {
    if (POSE_PARAMS[k].indexOf(over[k]) >= 0) pose[k] = over[k];
  });
  const props = (sceneState.props || over.props || []).slice();
  if (pose.gaze === 'phone' && props.indexOf('phone') < 0) props.push('phone');
  return { posture: posture, pose: pose, props: props };
}

// ---------------------------------------------------------------------------
// Colours. The office uses the page tokens (SPEC.md 11.1); Maya has her own
// plum and ochre, plus a skin tone and darker shades for the far limbs.

const C = {
  paper: '#F3ECDC', card: '#FFFBF2', deep: '#E6DCC6', ink: '#1C1F33', muted: '#565868', rule: '#D9CFBA',
  cobalt: '#2747B8', green: '#1A7050', ochre: '#D9A21B', vermilion: '#D2401E', plum: '#6B2E7A',
  plumDark: '#4E1F5A', trousers: '#2B2F4A', trousersFar: '#1F2236', skin: '#B07A52', skinFar: '#97663F', hair: '#1C1F33',
  wood: '#8C6A48'

// Time of day per round: the window's sky and sun, the light on the wall.
const TIME = {
  r1: { sky: '#C9D3EA', sun: C.ochre, sunY: 48, sunStep: 3, clockMin: 10, clockHour: 2, light: 0 },
  r2: { sky: '#EDC59A', sun: C.vermilion, sunY: 86, sunStep: 3, clockMin: 10, clockHour: 4, light: 0.16 }

// Geometry. Coordinates are in the 400 x 300 viewBox. Maya sits facing left,
// towards the counsellor, whose silhouette fills the bottom-left corner.

const FLOOR_Y = 262;

// her face reads at phone width (SPEC.md 12; checked in tests/art-gallery.mjs).
const FIG_SCALE = 1.45;
const FIG_PIVOT = { x: 262, y: 262 };
const SEAT = { x: 226, y: 222, w: 74 };
const HIP_Y = 213;
const TORSO = 60;
const HIP_X = { edge: 242, back: 266, leaningIn: 252 };
const LEAN = { edge: 3, back: -7, leaningIn: 17 }; // degrees towards the counsellor
const SHOULDER = {
  raised: { lift: 7, spread: 14, neck: 4 },
  neutral: { lift: 0, spread: 18, neck: 7 },
  relaxed: { lift: -3, spread: 20, neck: 9 }
};
const GAZE = {
  counsellor: { fx: -0.75, fy: 0.15 },
  floor: { fx: -0.45, fy: 0.95 },
  phone: { fx: -0.6, fy: 0.85 },
  door: { fx: 0.85, fy: 0.05 },
  window: { fx: -0.8, fy: -0.7 }
};
const HEAD = { down: { fwd: 6, drop: 2, fy: 0.45 }, level: { fwd: 0, drop: 0, fy: 0 }, up: { fwd: -2, drop: -2, fy: -0.35 } };
// Mouth: width, upper and lower curve depth (a filled shape between them).
const MOUTH = {
  flat: { w: 10, up: 0, low: 2.2, brow: 0 },
  tight: { w: 8, up: -2.6, low: 2.4, brow: 2.6 },
  slightSmile: { w: 11, up: 2.4, low: 2.8, brow: -0.8 },
  smile: { w: 13, up: 1.8, low: 8, brow: -1.6 }
};

function pt(x, y) { return { x: x, y: y }; }
function add(a, b, k) { return pt(a.x + b.x * (k === undefined ? 1 : k), a.y + b.y * (k === undefined ? 1 : k)); }

// Arm targets per arms value: elbow and hand for the near arm (1, towards the
// counsellor) and the far arm (2). L and R are the shoulder joints, H the hip.
function armTargets(arms, L, R, H, bag) {
  // Elbows that hang by the side sit halfway between shoulder and hip height,
  // so the arm keeps its length whether the shoulders are raised or dropped.
  const e1y = (L.y + H.y) / 2 + 4;
  const e2y = (R.y + H.y) / 2 + 4;
  switch (arms) {
    case 'crossed':
      return { e1: pt(L.x - 5, L.y + 25), h1: pt(R.x + 7, R.y + 17), e2: pt(R.x + 7, R.y + 27), h2: pt(L.x - 7, L.y + 15) };
    case 'bag':
      return { e1: pt(L.x - 2, e1y), h1: pt(bag.x - 16, bag.y - 1), e2: pt(R.x - 2, e2y), h2: pt(bag.x + 8, bag.y - 10) };
    case 'open':
      return { e1: pt(L.x - 12, e1y - 4), h1: pt(L.x - 36, e1y - 12), e2: pt(R.x + 10, e2y - 4), h2: pt(R.x + 32, e2y - 14) };
    case 'gesturing':
      return { e1: pt(L.x - 22, L.y + 20), h1: pt(L.x - 34, L.y - 6), e2: pt(R.x - 2, e2y), h2: pt(H.x - 20, H.y - 7) };

      return { e1: pt(L.x - 6, e1y), h1: pt(H.x - 30, H.y - 6), e2: pt(R.x - 2, e2y), h2: pt(H.x - 20, H.y - 8) };

// Every number the drawing needs. Flags (strings, booleans) are not blended.
function sceneVector(sceneState) {
  const r = poseFor(sceneState);
  const pose = r.pose;
  const round = sceneState.round === 'r2' ? 'r2' : 'r1';
  const time = TIME[round];
  const step = sceneState.step || 0;
  const sh = SHOULDER[pose.shoulders];
  const head = HEAD[pose.head];
  const gaze = GAZE[pose.gaze];
  const mouth = MOUTH[pose.mouth];

  const H = pt(HIP_X[pose.chair], HIP_Y);
  const th = LEAN[pose.chair] * Math.PI / 180;
  const u = pt(-Math.sin(th), -Math.cos(th)); // up the spine
  const p = pt(Math.cos(th), -Math.sin(th)); // across the body, towards the chair back
  const S = add(add(H, u, TORSO), pt(0, -sh.lift));
  const L = add(S, p, -sh.spread * 0.75);
  const R = add(S, p, sh.spread * 0.75);
  const hc = add(add(S, u, sh.neck + 19), pt(-head.fwd, head.drop));
  const fx = gaze.fx;
  const fy = Math.max(-1, Math.min(1.2, gaze.fy + head.fy));
  const bagHeld = pose.arms === 'bag';
  const bag = bagHeld ? pt(H.x - 26, H.y - 14) : pt(312, 250);
  const a = armTargets(pose.arms, L, R, H, bag);
  const K = pt(H.x - 44, H.y - 1);
  const minutes = time.clockMin + step * CLOCK_STEP_MIN;

  return {
    round: round,
    phone: r.props.indexOf('phone') >= 0,
    brochure: round === 'r2' || r.props.indexOf('brochure') >= 0,
    bagHeld: bagHeld ? 1 : 0,
    // Office.
    sunY: time.sunY + step * time.sunStep,
    minAngle: minutes * 6,
    hourAngle: (time.clockHour + minutes / 60) * 30,
    light: time.light,
    // Maya.
    hx: H.x, hy: H.y, lean: th,
    sx: S.x, sy: S.y, lx: L.x, ly: L.y, rx: R.x, ry: R.y, spread: sh.spread,
    cx: hc.x, cy: hc.y, fx: fx, fy: fy,
    e1x: a.e1.x, e1y: a.e1.y, h1x: a.h1.x, h1y: a.h1.y, e2x: a.e2.x, e2y: a.e2.y, h2x: a.h2.x, h2y: a.h2.y,
    kx: K.x, ky: K.y, bagX: bag.x, bagY: bag.y,
    mw: mouth.w, mup: mouth.up, mlow: mouth.low, brow: mouth.brow,
    eyeH: fy > 0.6 ? 1.8 : 4.2
  };
}

function lerpScene(a, b, t) {
  const out = {};
  Object.keys(b).forEach(function (k) {
    out[k] = typeof b[k] === 'number' && typeof a[k] === 'number' ? a[k] + (b[k] - a[k]) * t : b[k];

  return out;
}

// ---------------------------------------------------------------------------
// Drawing.

function n(v) { return Math.round(v * 10) / 10; }
function rect(x, y, w, h, fill, extra) { return '<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(w) + '" height="' + n(h) + '" fill="' + fill + '"' + (extra || '') + '/>'; }
function circ(x, y, r, fill, extra) { return '<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(r) + '" fill="' + fill + '"' + (extra || '') + '/>'; }
function poly(pts, fill) { return '<polygon points="' + pts.map(function (q) { return n(q[0]) + ',' + n(q[1]); }).join(' ') + '" fill="' + fill + '"/>'; }
function bar(x1, y1, x2, y2, w, colour, cap) {

function hand(x, y, angleFrom, colour) {

function office(v) {

  s += rect(dx, 196, 76, 7, C.ink) + rect(dx + 6, 203, 5, FLOOR_Y - 203, C.ink) + rect(dx + 66, 203, 5, FLOOR_Y - 203, C.ink);

function chair() {

  // Maya's chair: seat, back and legs.
  s += rect(SEAT.x + SEAT.w - 9, 136, 9, SEAT.y - 136, C.muted);
  s += rect(SEAT.x, SEAT.y, SEAT.w, 8, C.muted);

function maya(v) {
  let s = '';
  const H = pt(v.hx, v.hy), K = pt(v.kx, v.ky);
  // Legs: blocks, far leg first and darker. Ankles drop to the floor.
  const legs = function (dx, dy, cTrouser, cShoe) {
    let o = '';
    o += bar(H.x + dx, H.y + dy, K.x + dx, K.y + dy, 17, cTrouser, 'square');
    o += bar(K.x + dx, K.y + dy, K.x + dx + 3, FLOOR_Y - 7, 13, cTrouser, 'square');

  if (v.phone) s += rect(v.h1x - 4, v.h1y - 11, 8, 13, C.ink) + rect(v.h1x - 2.5, v.h1y - 9.5, 5, 8, C.cobalt);
  s += hand(v.h1x, v.h1y, 0, C.skin);
  // Head: hair disc, a bob behind the face, the face disc turned towards the gaze.
  const fcx = v.cx + v.fx * 6.5, fcy = v.cy + v.fy * 4.5 + 2.5;
  s += rect(v.cx - v.fx * 9 - 12, v.cy - 4, 24, 26, C.hair);
  s += circ(v.cx, v.cy, 21, C.hair);
  s += circ(fcx, fcy, 15.5, C.skin);
  // Fringe: the top of the hair disc cut by a chord.
  const yc = fcy - 6.5;
  const dy = yc - v.cy;
  const half = Math.sqrt(Math.max(0, 21 * 21 - dy * dy));
  s += '<path d="M ' + n(v.cx - half) + ' ' + n(yc) + ' A 21 21 0 0 1 ' + n(v.cx + half) + ' ' + n(yc) + ' Z" fill="' + C.hair + '"/>';

  const ex = fcx + v.fx * 4, ey = fcy + v.fy * 3 + 0.5;

  const eh = v.eyeH;
  s += rect(ex - gap - 2.2, ey - eh / 2, 4.4, eh, C.ink) + rect(ex + gap - 2.2, ey - eh / 2, 4.4, eh, C.ink);

  s += poly([[ex - gap - 3, by - v.brow * -0.0 - 1], [ex - gap + 3, by + v.brow * 0.6 - 1], [ex - gap + 3, by + v.brow * 0.6 + 0.8], [ex - gap - 3, by + 0.8]], C.hair);
  s += poly([[ex + gap - 3, by + v.brow * 0.6 - 1], [ex + gap + 3, by - 1], [ex + gap + 3, by + 0.8], [ex + gap - 3, by + v.brow * 0.6 + 0.8]], C.hair);
  const nx = fcx + v.fx * 9, ny = fcy + v.fy * 3 + 4;
  s += poly([[nx, ny - 4], [nx + v.fx * 5, ny + 1.5], [nx, ny + 1.5]], C.skinFar);
  const mx = fcx + v.fx * 4.5, my = fcy + v.fy * 3 + 8.5;
  const hw = v.mw / 2 * (1 - 0.25 * Math.abs(v.fx));
  s += '<path d="M ' + n(mx - hw) + ' ' + n(my) + ' Q ' + n(mx) + ' ' + n(my + v.mup) + ' ' + n(mx + hw) + ' ' + n(my) + ' Q ' + n(mx) + ' ' + n(my + v.mlow + v.mup) + ' ' + n(mx - hw) + ' ' + n(my) + ' Z" fill="' + C.ink + '"/>';
  return s;
}

// You: a dark over-the-shoulder silhouette at the frame edge, and your chair.
function counsellor() {
  return rect(96, 236, 10, 64, C.muted) + rect(80, 232, 28, 7, C.muted) +
    poly([[-40, 300], [-12, 262], [56, 250], [112, 270], [134, 300]], C.ink) +
    rect(18, 230, 30, 26, C.ink) + circ(30, 208, 38, C.ink);
}

function drawScene(v) {
  return '<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" shape-rendering="geometricPrecision">' +
    office(v) + '<g transform="translate(' + FIG_PIVOT.x + ' ' + FIG_PIVOT.y + ') scale(' + FIG_SCALE + ') translate(' + (-FIG_PIVOT.x) + ' ' + (-FIG_PIVOT.y) + ')">' + chair() + maya(v) + '</g>' + counsellor() + '</svg>';
}

// Alt text, generated from the pose (SPEC.md 12).

const ALT_WORDS = {
  chair: { edge: 'on the edge of the chair', back: 'back in the chair', leaningIn: 'leaning in towards you' },
  arms: { crossed: 'arms crossed', bag: 'holding her bag on her lap', lap: 'hands in her lap', open: 'hands open', gesturing: 'gesturing as she talks' },
  shoulders: { raised: 'shoulders raised', neutral: '', relaxed: 'shoulders relaxed' },
  gaze: { floor: 'looking at the floor', door: 'looking at the door', phone: 'looking at her phone', counsellor: 'looking at you', window: 'looking out of the window' },
  head: { down: 'head down', level: '', up: 'chin up' },
  mouth: { flat: '', tight: 'lips pressed together', slightSmile: 'with a slight smile', smile: 'smiling' }
};

function altFor(r) {
  const p = r.pose;
  const parts = [ALT_WORDS.arms[p.arms], ALT_WORDS.shoulders[p.shoulders]];
  if (r.props.indexOf('phone') >= 0 && p.gaze !== 'phone') parts.push('phone in her hand');
  parts.push(ALT_WORDS.gaze[p.gaze]);
  if (!(p.head === 'down' && (p.gaze === 'floor' || p.gaze === 'phone'))) parts.push(ALT_WORDS.head[p.head]);
  parts.push(ALT_WORDS.mouth[p.mouth]);
  return 'Maya sits ' + ALT_WORDS.chair[p.chair] + ', ' + parts.filter(Boolean).join(', ') + '.';
}

// sceneState: { meters, poseBias, pose (page overrides), props, round, step }
// Returns { svg, alt, posture, pose, vec }.
function renderScene(sceneState) {
  const r = poseFor(sceneState);
  const vec = sceneVector(sceneState);
  return { svg: drawScene(vec), alt: altFor(r), posture: r.posture, pose: r.pose, vec: vec };
}

// DOM helpers.

function h(tag, props, kids) {
  const e = document.createElement(tag);
  if (props) {
    Object.keys(props).forEach(function (k) {
      const v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'onclick') e.addEventListener('click', v);
      else e.setAttribute(k, v === true ? '' : String(v));
    });
  }
  (kids || []).forEach(function (c) {
    if (c === null || c === undefined || c === false) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}

function glyph(lever) {
  return h('span', { class: 'glyph', 'aria-hidden': 'true', html: '<svg viewBox="0 0 16 16" focusable="false">' + LEVER_GLYPHS[lever] + '</svg>' });
}

// A lever name with its glyph, in the lever's text colour (never colour alone).
function leverTag(lever) {
  return h('span', { class: 'lever-tag lv-' + lever }, [glyph(lever), LEVER_INFO[lever].name]);
}

function leverChip(lever) {
  return h('span', { class: 'lever-chip lv-' + lever }, [glyph(lever), LEVER_INFO[lever].name]);
}

function button(label, onclick, opts) {
  opts = opts || {};
  return h('button', {
    type: 'button',
    class: 'btn' + (opts.ghost ? ' btn--ghost' : ''),
    'data-primary': opts.primary ? true : null,
    'data-action': opts.action || null,
    onclick: onclick
  }, [h('span', { text: label }), opts.dest ? h('span', { class: 'dest', text: opts.dest }) : null]);
}

function runhead(left, pageNo) {
  return h('header', { class: 'runhead' }, [
    h('span', { text: left }),
    pageNo ? h('span', { class: 'pageno', 'data-page': pageNo, text: 'p. ' + pageNo }) : h('span', { class: 'pageno', text: 'Turn the Page' })
  ]);
}

// Decorative geometry: shapes bleeding off the edges, behind the content.
// Each entry: [kind, colour, inline position and size].
function deco(shapes) {
  return h('div', { class: 'deco', 'aria-hidden': 'true' }, shapes.map(function (s) {
    return h('span', { class: 'shape ' + s[0] + ' ' + s[1], style: s[2] });
  }));
}

  debrief: [['square', 'challenge', 'width:260px;height:260px;right:-120px;top:120px'], ['circle', 'question', 'width:340px;height:340px;left:-180px;bottom:-120px']],

};

function pageEl(screen, extraClass, kids) {
  return h('section', { class: 'page page--' + screen + (extraClass ? ' ' + extraClass : ''), 'data-screen': screen, tabindex: '-1' }, [deco(DECO[screen] || DECO.scene)].concat(kids));

// ---------------------------------------------------------------------------
// Persistence (SPEC.md 14.4). Everything is wrapped in try/catch: if storage
// is unavailable the simulation still runs, with a notice. No names or free
// text are stored; nothing is sent anywhere.

const store = (function () {
  let ls = null;
  try {
    ls = window.localStorage;
    const probe = STORE_KEY + ':probe';
    ls.setItem(probe, '1');
    ls.removeItem(probe);
  } catch (e) {
    ls = null;
  }
  return {
    ok: ls !== null,
    load: function () {
      if (!ls) return null;
      try {
        const raw = ls.getItem(STORE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    },
    save: function (data) {
      if (!ls) return false;
      try {
        ls.setItem(STORE_KEY, JSON.stringify(data));
        return true;
      } catch (e) {
        return false;
      }
    },
    clear: function () {
      if (!ls) return;
      try { ls.removeItem(STORE_KEY); } catch (e) { /* nothing to clear */ }
    }
  };
})();

function validRoundState(st) {
  if (!st || typeof st !== 'object' || st.caseId !== MAYA.id) return false;
  const round = MAYA.rounds[st.round];
  if (!round || !st.meters || !Array.isArray(st.history)) return false;
  if (st.nodeId !== null && !round.nodes[st.nodeId]) return false;
  return st.history.every(function (e) { return round.nodes[e.nodeId]; });
}

function validSave(d) {
  if (!d || d.v !== SAVE_VERSION || SCREEN_NAMES.indexOf(d.screen) < 0 || d.screen === 'cover') return false;
  if (d.state !== null && !validRoundState(d.state)) return false;
  if (d.r1 !== null && !validRoundState(d.r1)) return false;
  const needsState = ['scene', 'consequence', 'act', 'ending', 'debrief'];
  if (needsState.indexOf(d.screen) >= 0 && !d.state) return false;
  if (d.screen === 'consequence' && d.state.history.length === 0) return false;
  if (d.screen === 'interlude' && !(d.r1 && d.r1.ending)) return false;
  if (d.screen === 'scene' && (d.state.ending || d.state.nodeId === null)) return false;
  return true;
}

// ---------------------------------------------------------------------------
// App state. `state` is the engine state of the current round; `r1` is the
// finished Round 1 state (for the carry-over); `lever` and `picked` are the
// unfinished first step of a choice.

registerCase(MAYA);

const root = document.getElementById('app');
const live = h('div', { class: 'sr-only', 'aria-live': 'polite', 'aria-atomic': 'true', id: 'meter-announcer' });
document.body.appendChild(live);

const view = { screen: 'cover', state: null, r1: null, lever: null, picked: null, seed: null };
let resumeData = null;
(function () {
  const d = store.load();
  if (validSave(d)) resumeData = d;
})();

function showStorageNotice() {
  if (document.getElementById('storage-notice')) return;
  const n = h('div', { class: 'notice', id: 'storage-notice', role: 'status', text: 'This browser is not letting the page save your progress. You can still play, but if you close or reload the page you will start again.' });
  document.body.insertBefore(n, root);
}
if (!store.ok) showStorageNotice();

function persist() {
  if (view.screen === 'cover') return; // the cover keeps the saved place for Resume
  const ok = store.save({
    v: SAVE_VERSION, screen: view.screen, state: view.state, r1: view.r1,
    lever: view.lever, picked: view.picked, seed: view.seed
  });
  if (!ok) showStorageNotice();
}

function newSeed() {
  const m = /[?&]seed=(\d+)/.exec(window.location.search);
  if (m) return Number(m[1]);
  return (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0;
}

function reducedMotion() {
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

// ---------------------------------------------------------------------------
// Rendering.

// The old page slides off over the new one (SPEC.md 11.3).
function pageTurn(oldPage) {
  if (reducedMotion()) return;
  const wrap = h('div', { class: 'turn-out', 'aria-hidden': 'true' });
  wrap.inert = true;
  const clone = oldPage.cloneNode(true);
  clone.removeAttribute('tabindex');
  clone.style.transform = 'translateY(' + (-window.scrollY) + 'px)';
  wrap.appendChild(clone);
  document.body.appendChild(wrap);
  let gone = false;
  function done() { if (!gone) { gone = true; wrap.remove(); } }
  wrap.addEventListener('animationend', done);
  setTimeout(done, 700);
}

function render(opts) {
  opts = opts || {};
  const old = root.querySelector('.page');
  if (old && opts.turn) pageTurn(old);
  const page = SCREENS[view.screen](opts);
  root.replaceChildren(page);
  if (opts.turn) window.scrollTo(0, 0);
  persist();
  const target = (opts.focus && page.querySelector(opts.focus)) || page;
  target.focus({ preventScroll: true });
}

function go(screen, opts) {
  view.screen = screen;
  render(Object.assign({ turn: true }, opts || {}));
}

function currentRound() {
  return MAYA.rounds[view.state.round];
}

function roundLabel(st) {
  return ROUND_LABELS[st.round] + ' · ' + MAYA.rounds[st.round].title;
}

// Destination pages for a set of options (SPEC.md 11.3). A route that depends
// on the meters lists every page it can lead to, so the number never gives
// away which wording is the skilful one.
function destLabel(round, node, options) {
  const pages = [];
  let end = false;
  options.forEach(function (o) {
    const r = routeFor(node, o);
    (Array.isArray(r) ? r.map(function (x) { return x.to; }) : [r]).forEach(function (t) {
      if (t === null) end = true;
      else if (pages.indexOf(round.nodes[t].page) < 0) pages.push(round.nodes[t].page);
    });
  });
  pages.sort(function (a, b) { return a - b; });
  const parts = pages.map(String);
  if (!parts.length) return '→ the end';
  return '→ p. ' + parts.join(' or ') + (end ? ' or the end' : '');
}

// ---------------------------------------------------------------------------
// Meters: ten segments, no numbers. With `change`, the segments that moved
// flash in the causing lever's colour and a marker shows the direction.

function segCount(v) {
  return Math.max(0, Math.min(10, Math.round(v / 10)));
}

function metersView(meters, change, extraClass) {
  const box = h('div', { class: 'meters' + (extraClass ? ' ' + extraClass : '') });
  RULES.meters.forEach(function (m) {
    const filled = segCount(meters[m]);
    const delta = change ? meters[m] - change.before[m] : 0;
    const prevFilled = change ? segCount(change.before[m]) : filled;
    let lo = Math.min(prevFilled, filled);
    let hi = Math.max(prevFilled, filled);
    if (delta !== 0 && lo === hi) {
      // The change did not cross a segment boundary: flash the edge segment.
      if (delta > 0) { lo = Math.max(0, filled - 1); hi = lo + 1; } else { lo = Math.min(9, filled); hi = lo + 1; }
    }
    const segs = h('div', { class: 'segs', 'aria-hidden': 'true' });
    for (let i = 0; i < 10; i++) {
      let cls = 'seg' + (i < filled ? ' on' : '');
      if (change && change.animate && delta !== 0 && i >= lo && i < hi) cls += i < filled ? ' flash-on' : ' flash-off';
      segs.appendChild(h('span', { class: cls }));
    }
    const label = METER_INFO[m].name;
    const meter = h('div', {
      class: 'meter',
      role: 'img',
      'aria-label': label + ': ' + LEVEL_WORDS[filled],
      'data-meter': m,
      'data-value': meters[m],
      'data-filled': filled,
      'data-change': delta,
      style: change ? '--flash-colour: var(--lever-' + change.lever + ')' : null
    }, [
      h('span', { class: 'meter-label', 'aria-hidden': 'true', text: label }),
      segs,
      h('span', { class: 'mark', 'aria-hidden': 'true', text: delta > 0 ? '▲' : delta < 0 ? '▼' : '' })
    ]);
    box.appendChild(meter);
  });
  return box;
}

function describeChange(deltas) {
  const parts = RULES.meters.filter(function (m) { return deltas[m] !== 0; }).map(function (m) {
    const d = deltas[m];
    const size = Math.abs(d) <= CHANGE_WORDS.little ? ' a little' : Math.abs(d) >= CHANGE_WORDS.lot ? ' a lot' : '';
    return METER_INFO[m].name + (d > 0 ? ' rose' : ' fell') + size + '.';
  });
  return parts.length ? parts.join(' ') : 'The meters did not move.';
}

function announce(text) {
  live.textContent = '';
  setTimeout(function () { live.textContent = text; }, 60);
}

// ---------------------------------------------------------------------------
// Scene (SPEC.md 12). art.js draws the office and Maya. On a scene page the
// page's pose hints override the posture; on a consequence page Maya's
// posture follows the meters after the choice (only the props stay), so the
// picture shows how she took it. Between two pictures in the same round the
// pose interpolates over 0.4s, or changes at once under reduced motion.

const POSE_TWEEN_MS = 400;
let lastArt = null; // { round, vec } of the last picture drawn

function sceneView(st, node, consequence) {
  const pose = (node.scene || {}).pose || {};
  const art = renderScene({
    meters: st.meters,
    poseBias: MAYA.profile.poseBias,
    pose: consequence ? null : pose,
    props: pose.props || [],
    round: st.round,
    step: st.history.length
  });
  const holder = h('div', { class: 'scene-art', role: 'img', 'aria-label': art.alt, html: art.svg });
  const fig = h('figure', { class: 'scene-area scene-frame', 'data-posture': art.posture }, [holder]);
  Object.keys(art.pose).forEach(function (k) { fig.setAttribute('data-' + k, art.pose[k]); });
  const from = lastArt && lastArt.round === st.round ? lastArt.vec : null;
  lastArt = { round: st.round, vec: art.vec };
  if (from && !reducedMotion()) tweenScene(holder, from, art.vec);
  return fig;
}

function tweenScene(holder, from, to) {
  let start = null;
  holder.setAttribute('data-tweening', '');
  holder.innerHTML = drawScene(from);
  function frame(now) {
    if (!holder.isConnected && start !== null) return;
    if (start === null) start = now;
    const t = Math.min(1, (now - start) / POSE_TWEEN_MS);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // ease in and out
    holder.innerHTML = drawScene(lerpScene(from, to, e));
    if (t < 1) window.requestAnimationFrame(frame);
    else holder.removeAttribute('data-tweening');
  }
  window.requestAnimationFrame(frame);
}

function storyHead(node) {

  opts = opts || {};

      type: 'button',
      class: 'line-option' + (coloured ? ' lv-' + o.lever : ''),
